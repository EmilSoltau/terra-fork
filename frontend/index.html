<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>TERRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Must run before Leaflet loads: PointerEvent exists in WKWebView/desktop
         and would otherwise set L.Browser.touch=true, closing polygons at 3 pts. -->
    <script>window.L_NO_TOUCH = true</script>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: rgb(8, 7, 6);
        overflow: hidden;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse 90% 55% at 50% -5%,
            rgba(196, 148, 96, 0.18),
            rgba(196, 148, 96, 0.05) 32%,
            transparent 62%),
          rgb(8, 7, 6);
        opacity: 1;
        transition: opacity 420ms ease;
        pointer-events: all;
      }
      #splash.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.1rem;
        text-align: center;
        user-select: none;
      }
      #splash .splash-logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #splash .splash-brand {
        margin: 0;
        font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
        font-weight: 600;
        font-size: 1.35rem;
        letter-spacing: 0.18em;
        color: rgb(236, 230, 220);
      }
      #splash .splash-eyebrow {
        margin: 0;
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgb(148, 136, 120);
      }
      #splash .splash-led {
        width: 28px;
        height: 2px;
        margin-top: 0.35rem;
        border-radius: 1px;
        background: rgb(216, 148, 74);
        opacity: 0.85;
      }
      @keyframes splash-pulse {
        0%, 100% { opacity: 0.92; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.03); }
      }
    </style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-inner">
    <img class="splash-logo" src="/terra-logo.png" alt="" width="72" height="72"/>
    <p class="splash-brand">TERRA</p>
    <p class="splash-eyebrow">land cover · sentinel-2</p>
    <div class="splash-led" aria-hidden="true"></div>
  </div>
</div>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
